# Build, test, lint and format checks on every pull request and every push to
# main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes whatever is still running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # nx needs history to work out what changed against the base branch.
          fetch-depth: 0

      # No version pinned here. The root package.json already names one under
      # `packageManager`, and stating it twice is how the two drift apart.
      - uses: pnpm/action-setup@v6

      # 22 rather than 20, which reached end of life in April 2026. It is also
      # what `vitest` declares support for: ^20 || ^22 || >=24.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # nx caches per project, so an unchanged package is restored rather than
      # rebuilt. Keyed on the lockfile and source so a dependency bump busts it.
      - name: Restore nx cache
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Build first. A type error here is the failure most worth catching, and
      # the packages have to be built before anything can resolve them anyway.
      - name: Build packages
        run: pnpm build:packages

      # The invariants the build itself cannot state: that every subpath in an
      # exports map lands on a file, that a compound component's three export
      # forms agree, that the directive survived, and that the numbers in the
      # token README are still the numbers. They read `dist`, so they run
      # directly after the build and before the slower steps below.
      - name: Test
        run: pnpm test

      # The documentation site imports all twenty-three components through the
      # subpath they are published under, so building it is what proves the
      # export map, the built output and the exported names still agree.
      # `build:packages` alone does not: renaming an export that no other
      # component imports passes it silently, and nineteen of the twenty-three
      # are imported by nothing else.
      - name: Build docs
        run: pnpm --filter @minuk-hwang-design-system/docs build

      # Neither of the two bugs that shipped in 1.0.0 could be caught by the
      # steps above. The site resolves the packages through workspace links
      # rather than tarballs, and every page in it is a client component, so it
      # never exercises the export maps as published or the server boundary.
      - name: Build a consumer
        run: node scripts/verify-consumer.mjs

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
